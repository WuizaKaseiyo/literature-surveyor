# tools/manifest.yaml — declares which custom tools this talent installs
# When the talent is hired, OMC's onboarding.install_talent_functions() reads this
# and registers each tool into the company-wide tool_registry, granting access
# to the new employee.

custom_tools:
  - arxiv_search
  - semantic_scholar_search
  - openalex_search
  - parallel_multi_search
  - pdf_extract
  - corpus_add_paper
  - corpus_search
  - corpus_status
  - corpus_list_papers
  - corpus_get_paper
  - extract_claims
  - claim_search
  - claim_list_by_paper
  - claim_get
  - claim_status
  - claim_find_evidence
  - detect_conflicts
  - verify_citations
  - fact_check_rendered_survey
  - self_assess
  - run_start
  - run_stage_done
  - run_finalize

# Note: corpus_store.py defines 5 separate @tool functions, and
# run_metadata.py defines 3 — OMC's loader inspects each .py for @tool
# decorators and registers each, so each function gets its own entry above.
